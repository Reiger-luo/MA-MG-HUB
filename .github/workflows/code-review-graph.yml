name: MA-MG-HUB Code Review Graph

on:
  pull_request:
    paths:
      - "scripts/**"
      - "assets/*.js"
      - "worker/**"
      - "tests/**"

concurrency:
  group: code-review-graph-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  graph-review:
    # fork PR 需要拆分可信评论工作流；当前只对同仓分支写评论
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Review code graph impact
        uses: tirth8205/code-review-graph@6a1ee1c7063cc35cfa5ff12b8198c29360f3e4ad # v2.3.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          python-version: "3.11"
          fail-on-risk: "none"
