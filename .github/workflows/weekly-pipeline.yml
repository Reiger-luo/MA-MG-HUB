name: MA-MG-HUB Weekly Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Static quality gates
        run: |
          python -m py_compile scripts/*.py scripts/common/*.py
          node --check assets/*.js
          if grep -R "ssl\\._create_unverified_context\\|_create_unverified_https_context\\|28fc90c1db04461a9f51f72cfe9b8418" scripts assets pages; then
            echo "Unsafe secret or SSL bypass pattern found."
            exit 1
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          CHICTR_COOKIE: ${{ secrets.CHICTR_COOKIE }}
        run: |
          python scripts/run-weekly-pipeline.py

      - name: Publish weekly summary
        run: |
          if [ -f data/weekly-summary.md ]; then
            cat data/weekly-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "weekly-summary.md not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.js data/weekly-summary.md data/china-regulatory-status.json data/clinicaltrials-pipeline-cache.json data/chictr-trials-cache.json data/china-drug-trials-cache.json data/china-drug-trials-changes.json data/guideline-consensus-cache.json assets/*.js assets/*.css pages/*.html index.html
          if git diff --cached --quiet; then
            echo "No public frontend updates."
          else
            git commit -m "chore: update MG hub weekly data"
            git push
          fi
