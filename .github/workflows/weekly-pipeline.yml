name: MA-MG-HUB Weekly Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 0"

permissions:
  contents: write

jobs:
  weekly-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          python scripts/run-weekly-pipeline.py

      - name: Publish weekly summary
        run: |
          if [ -f data/weekly-summary.md ]; then
            cat data/weekly-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "weekly-summary.md not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.js data/weekly-summary.md assets/*.js assets/*.css pages/*.html index.html
          if git diff --cached --quiet; then
            echo "No public frontend updates."
          else
            git commit -m "chore: update MG hub weekly data"
            git push
          fi
