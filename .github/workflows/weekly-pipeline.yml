name: MA-MG-HUB Weekly Pipeline

on:
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Skip PubMed incremental fetch"
        required: false
        default: "false"
  schedule:
    - cron: "0 15 * * 0"

permissions:
  contents: write

jobs:
  weekly-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.skip_fetch }}" = "true" ]; then
            python scripts/run-weekly-pipeline.py --skip-fetch
          else
            python scripts/run-weekly-pipeline.py
          fi

      - name: Commit updated public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.js assets/*.js assets/*.css pages/*.html index.html
          if git diff --cached --quiet; then
            echo "No public frontend updates."
          else
            git commit -m "chore: update MG hub weekly data"
            git push
          fi
