name: MA-MG-HUB Release Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Static quality gates
        run: |
          python -m py_compile scripts/*.py scripts/common/*.py
          node --check assets/*.js
          if grep -R "ssl\\._create_unverified_context\\|_create_unverified_https_context\\|28fc90c1db04461a9f51f72cfe9b8418" scripts assets pages; then
            echo "Unsafe secret or SSL bypass pattern found."
            exit 1
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Validate current public release
        run: |
          python scripts/run-weekly-pipeline.py --mode validate-only --run-id "ci-${GITHUB_RUN_ID}"
          bash scripts/build-sites-static.sh
          git diff --exit-code
