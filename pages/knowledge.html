<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 · MA-MG-HUB</title>
<link rel="stylesheet" href="/MA-MG-HUB/assets/main.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/MA-MG-HUB/" class="nav-brand">MA-MG-HUB</a>
    <div class="nav-links">
      <a href="/MA-MG-HUB/" class="nav-link">工作台</a>
      <a href="/MA-MG-HUB/pages/literature.html" class="nav-link">情报中心</a>
      <a href="/MA-MG-HUB/pages/knowledge.html" class="nav-link active">知识库</a>
      <a href="/MA-MG-HUB/pages/msl.html" class="nav-link">MSL工作台</a>
      <a href="/MA-MG-HUB/pages/materials.html" class="nav-link">内容工坊</a>
      <a href="/MA-MG-HUB/pages/landscape.html" class="nav-link">诊治格局</a>
      <a href="/MA-MG-HUB/pages/data-ops.html" class="nav-link">数据状态</a>
    </div>
  </div>
</nav>

<main class="main">
  <div class="page-header">
    <h1>知识库</h1>
    <div class="page-header-actions">
      <span class="update-badge" id="knowledgeBadge">Loading...</span>
    </div>
  </div>

  <p style="color:var(--fg2);font-size:0.86rem;margin:-0.4rem 0 1rem;">
    efgartigimod-wiki 私有知识图谱 · 点击节点查看详情，滚轮缩放，拖拽平移。
  </p>

  <div class="kg-layout">
    <div>
      <div class="kg-canvas-wrap">
        <svg id="knowledgeGraph" class="kg-canvas" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="kg-controls">
          <button class="kg-ctrl-btn" id="kgZoomIn" title="放大" type="button">+</button>
          <button class="kg-ctrl-btn" id="kgZoomOut" title="缩小" type="button">−</button>
          <button class="kg-ctrl-btn" id="kgZoomReset" title="重置视图" type="button">⟲</button>
        </div>
        <span class="kg-zoom-label" id="kgZoomLabel">100%</span>
      </div>
      <div class="kg-legend">
        <span class="kg-legend-item"><span class="kg-legend-dot entity"></span>实体</span>
        <span class="kg-legend-item"><span class="kg-legend-dot concept"></span>概念</span>
        <span class="kg-legend-item"><span class="kg-legend-dot data-point"></span>数据点</span>
        <span class="kg-legend-item"><span class="kg-legend-dot comparison"></span>对比</span>
        <span class="kg-legend-item"><span class="kg-legend-dot contested"></span>⚠ 争议节点</span>
        <span class="kg-legend-item" style="color:var(--fg3)">节点大小 = 关联研究数</span>
      </div>
    </div>

    <aside class="kg-detail" id="knowledgeDetail">
      <div class="kg-empty-hint">点击图谱节点查看详情</div>
    </aside>
  </div>

  <div class="kg-collapse">
    <button class="kg-collapse-head" type="button">
      ▍临床问答证据状态
      <span class="kg-collapse-count" id="knowledgeQCount"></span>
      <span class="kg-collapse-arrow">▶</span>
    </button>
    <div class="kg-collapse-body">
      <div id="knowledgeQuestions"></div>
    </div>
  </div>

  <div class="kg-collapse">
    <button class="kg-collapse-head" type="button">
      ▍跨库检索（图谱节点 · 文献 · 专家）
      <span class="kg-collapse-arrow">▶</span>
    </button>
    <div class="kg-collapse-body">
      <div class="knowledge-search">
        <input id="knowledgeSearch" placeholder="检索关键词，例如 FcRn safety / seronegative / efgartigimod">
      </div>
      <div id="knowledgeSearchResults"></div>
    </div>
  </div>
</main>

<script src="/MA-MG-HUB/data/knowledge-graph.js"></script>
<script src="/MA-MG-HUB/data/landscape-data.js"></script>
<script src="/MA-MG-HUB/data/literature-recent.js"></script>
<script src="/MA-MG-HUB/data/expert-profiles.js"></script>
<script src="/MA-MG-HUB/assets/knowledge.js"></script>
</body>
</html>
