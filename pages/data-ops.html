<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据状态 · MA-MG-HUB</title>
<link rel="stylesheet" href="/MA-MG-HUB/assets/main.css">
<style>
.ops-main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
.source-card {
  background: var(--bg2); border-radius: 8px;
  border: 1px solid var(--bg3); padding: 1rem 1.2rem;
  margin-bottom: 0.6rem;
  display: flex; align-items: center; justify-content: space-between;
}
.source-info { flex: 1; }
.source-name { font-size: 0.95rem; font-weight: 500; color: var(--fg); }
.source-meta { font-size: 0.8rem; color: var(--fg3); margin-top: 0.15rem; }
.source-status { font-size: 0.8rem; }
.source-status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 0.3rem; }
.source-status .dot.green { background: var(--green); }
.source-status .dot.yellow { background: var(--yellow); }
.source-status .dot.gray { background: var(--bg3); }
.source-status .dot.red { background: #d96c6c; }
.ops-section-title { font-size: 0.9rem; font-weight: 500; color: var(--fg2); margin: 1.2rem 0 0.6rem; }
.ops-btn {
  padding: 0.4rem 0.8rem; border-radius: 6px;
  background: var(--accent); color: #fff; border: none;
  font-size: 0.82rem; cursor: pointer;
  transition: opacity 0.15s;
}
.ops-btn:hover { opacity: 0.85; }
.ops-btn:disabled { opacity: 0.4; cursor: default; }
.log-line {
  font-size: 0.8rem; color: var(--fg3); padding: 0.3rem 0;
  border-bottom: 1px solid var(--bg3);
  font-family: monospace;
}
.artifact-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem; }
.artifact-item {
  background: var(--bg2); border: 1px solid var(--bg3); border-radius: 8px;
  padding: 0.8rem 0.9rem;
}
.artifact-name { font-size: 0.84rem; color: var(--fg); font-weight: 500; }
.artifact-meta { font-size: 0.76rem; color: var(--fg3); margin-top: 0.2rem; line-height: 1.5; }
.community-audit-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.6rem; }
.community-audit-card {
  background: var(--bg2); border: 1px solid var(--bg3); border-radius: 8px;
  padding: 0.8rem 0.9rem;
}
.community-audit-card span { display: block; color: var(--fg3); font-size: 0.74rem; }
.community-audit-card strong { display: block; color: var(--fg); font-size: 1.22rem; line-height: 1.25; margin-top: 0.12rem; }
.community-audit-card em { display: block; color: var(--fg3); font-size: 0.72rem; font-style: normal; margin-top: 0.16rem; }
.community-audit-card.warning strong { color: var(--yellow); }
.community-audit-card.danger strong { color: var(--red); }
.ops-note { font-size:0.78rem;color:var(--fg3);margin-top:0.3rem;line-height:1.7; }
.section-divider { border: none; border-top: 1px solid var(--bg3); margin: 1.5rem 0; }
@media (max-width: 640px) {
  .source-card { align-items: flex-start; gap: 0.7rem; }
  .source-status { white-space: nowrap; }
  .artifact-grid { grid-template-columns: 1fr; }
  .community-audit-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/MA-MG-HUB/" class="nav-brand">MA-MG-HUB</a>
    <div class="nav-links">
      <a href="/MA-MG-HUB/" class="nav-link">工作台</a>
      <a href="/MA-MG-HUB/pages/literature.html" class="nav-link">情报中心</a>
      <a href="/MA-MG-HUB/pages/landscape.html" class="nav-link">诊治格局</a>
      <a href="/MA-MG-HUB/pages/knowledge.html" class="nav-link">知识库</a>
      <a href="/MA-MG-HUB/pages/msl.html" class="nav-link">MSL工作台</a>
      <a href="/MA-MG-HUB/pages/data-ops.html" class="nav-link active">数据状态</a>
    </div>
  </div>
</nav>

<div class="ops-main">
  <div class="page-header">
    <h1>🔧 数据状态</h1>
  </div>

  <!-- 源健康度 -->
  <div class="ops-section-title" style="margin-top:0">数据源</div>
  <div id="sourceList">
    <div class="source-card">
      <div class="source-info">
        <div class="source-name">读取中...</div>
        <div class="source-meta">正在加载管线状态</div>
      </div>
      <div class="source-status"><span class="dot gray"></span>加载</div>
    </div>
  </div>

  <hr class="section-divider">

  <!-- 操作 -->
  <div class="ops-section-title">操作</div>
  <div style="display:flex;gap:0.6rem;flex-wrap:wrap;margin-bottom:0.5rem">
    <a class="ops-btn" href="/MA-MG-HUB/data/dashboard-data.js" target="_blank" style="text-decoration:none">查看 Dashboard 数据</a>
    <a class="ops-btn" href="/MA-MG-HUB/data/signals-weekly.js" target="_blank" style="text-decoration:none">查看信号数据</a>
    <a class="ops-btn" href="/MA-MG-HUB/data/pipeline-status.js" target="_blank" style="text-decoration:none">查看管线状态</a>
    <a class="ops-btn" href="/MA-MG-HUB/data/communityAudit.js" target="_blank" style="text-decoration:none">查看社区 Audit</a>
  </div>
  <div class="ops-note" id="pipelineNote">
    本地更新命令：<code>python3 scripts/run-weekly-pipeline.py</code>。GitHub Actions 可手动触发 weekly-pipeline。
  </div>

  <hr class="section-divider">

  <!-- 公开产物 -->
  <div class="ops-section-title">公开数据产物</div>
  <div class="artifact-grid" id="artifactGrid"></div>

  <hr class="section-divider">

  <!-- 社区语义层审计 -->
  <div class="ops-section-title">社区语义层 Audit</div>
  <div class="community-audit-grid" id="communityAuditGrid">
    <div class="community-audit-card">
      <span>读取中</span>
      <strong>--</strong>
      <em>正在加载社区审计数据</em>
    </div>
  </div>
  <div class="ops-note" id="communityAuditNote"></div>

  <hr class="section-divider">

  <!-- 更新日志 -->
  <div class="ops-section-title">更新日志</div>
  <div id="opsLog">
    <div class="log-line">正在加载管线状态...</div>
  </div>

  <script src="/MA-MG-HUB/data/dashboard-data.js"></script>
  <script src="/MA-MG-HUB/data/pipeline-status.js"></script>
  <script src="/MA-MG-HUB/data/communityAudit.js"></script>
  <script>
  (function(){
    const dashboard = window.MG_DASHBOARD_DATA || {};
    const stats = dashboard.stats || {};
    const status = window.MG_PIPELINE_STATUS || {};
    const communityAudit = window.MG_COMMUNITY_AUDIT || {};
    const sourceList = document.getElementById('sourceList');
    const artifactGrid = document.getElementById('artifactGrid');
    const communityAuditGrid = document.getElementById('communityAuditGrid');
    const communityAuditNote = document.getElementById('communityAuditNote');
    const opsLog = document.getElementById('opsLog');
    const pipelineNote = document.getElementById('pipelineNote');
    const colorMap = { ok: 'green', generated: 'green', planned: 'yellow', manual: 'yellow', missing: 'red' };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, function(char) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
      });
    }

    function compactNumber(value) {
      const number = Number(value || 0);
      if (number >= 10000) return (number / 10000).toFixed(1).replace(/\.0$/, '') + '万';
      return String(number);
    }

    function formatRate(value, total) {
      const number = Number(value || 0);
      const denominator = Number(total || 0);
      if (!denominator) return '0%';
      return (number / denominator * 100).toFixed(1).replace(/\.0$/, '') + '%';
    }

    function renderSources() {
      const fallback = [
        {
          name: 'PubMed 近一年公开库',
          meta: (stats.recent_articles || 0) + ' 篇近1年文献 · ' + (stats.china_articles || 0) + ' 篇中国相关 · ' + (stats.signals || 0) + ' 条候选信号',
          status: 'ok',
          status_label: '正常'
        }
      ];
      const sources = status.sources || fallback;
      sourceList.innerHTML = sources.map(function(source) {
        const color = colorMap[source.status] || 'gray';
        return '<div class="source-card">' +
          '<div class="source-info">' +
            '<div class="source-name">' + escapeHtml(source.name) + '</div>' +
            '<div class="source-meta">' + escapeHtml(source.meta) + '</div>' +
          '</div>' +
          '<div class="source-status"><span class="dot ' + color + '"></span>' + escapeHtml(source.status_label || source.status || '-') + '</div>' +
        '</div>';
      }).join('');
    }

    function renderPipelineNote() {
      const pipeline = status.pipeline || {};
      const command = pipeline.local_command || 'python3 scripts/run-weekly-pipeline.py';
      const workflow = pipeline.workflow || 'weekly-pipeline';
      const schedule = pipeline.schedule || '每周';
      const policy = pipeline.policy || '周更只处理新增公开文献。';
      pipelineNote.innerHTML = '本地更新命令：<code>' + escapeHtml(command) + '</code>。GitHub Actions：' +
        escapeHtml(workflow) + '（' + escapeHtml(schedule) + '）。<br>' + escapeHtml(policy);
    }

    function renderArtifacts() {
      const artifacts = status.artifacts || [];
      if (!artifacts.length) {
        artifactGrid.innerHTML = '<div class="artifact-item"><div class="artifact-name">暂无产物状态</div><div class="artifact-meta">等待 pipeline-status.js 生成</div></div>';
        return;
      }
      artifactGrid.innerHTML = artifacts.map(function(item) {
        const count = item.count === null || item.count === undefined ? '' : ' · ' + item.count + ' 条';
        const size = item.size_kb === null || item.size_kb === undefined ? '' : ' · ' + item.size_kb + ' KB';
        return '<div class="artifact-item">' +
          '<div class="artifact-name">' + escapeHtml(item.label) + '</div>' +
          '<div class="artifact-meta">' + escapeHtml(item.id) + count + size + '<br>更新时间 ' + escapeHtml(item.updated_at || '-') + '</div>' +
        '</div>';
      }).join('');
    }

    function renderLogs() {
      const logs = status.logs || ['pipeline-status.js 尚未生成；页面正在使用 Dashboard 兜底数据。'];
      opsLog.innerHTML = logs.map(function(line) {
        return '<div class="log-line">' + escapeHtml(line) + '</div>';
      }).join('');
    }

    function renderCommunityAudit() {
      const summary = communityAudit.summary || {};
      const health = communityAudit.health || {};
      const total = Number(summary.total_articles || 0);
      if (!Object.keys(summary).length) {
        communityAuditGrid.innerHTML = '<div class="community-audit-card warning"><span>社区层</span><strong>未生成</strong><em>等待 communityAudit.js</em></div>';
        communityAuditNote.textContent = '社区语义层尚未生成；运行周更管线后会自动重建。';
        return;
      }

      const statusLabel = { ok: '正常', needsReview: '待 Review', warning: '关注', missing: '缺失' }[health.status] || (health.status || '未知');
      const items = [
        { label: '总文献', value: compactNumber(total), note: 'PubMed full abstract 基线' },
        { label: '已归类', value: compactNumber(summary.assigned_articles), note: formatRate(summary.assigned_articles, total) },
        { label: '未归类', value: compactNumber(summary.unassigned_articles), note: formatRate(summary.unassigned_articles, total) },
        { label: '低置信度', value: compactNumber(summary.low_confidence_articles), note: formatRate(summary.low_confidence_articles, total), level: 'warning' },
        { label: '冲突归类', value: compactNumber(summary.conflict_articles), note: formatRate(summary.conflict_articles, total), level: 'warning' },
        { label: '近14天未归类', value: compactNumber(summary.recent_unassigned_articles), note: '新文献覆盖检查', level: summary.recent_unassigned_articles ? 'danger' : '' },
        { label: '审计状态', value: statusLabel, note: '规则基线需持续校准', level: health.status === 'needsReview' ? 'warning' : '' }
      ];

      communityAuditGrid.innerHTML = items.map(function(item) {
        return '<div class="community-audit-card ' + escapeHtml(item.level || '') + '">' +
          '<span>' + escapeHtml(item.label) + '</span>' +
          '<strong>' + escapeHtml(item.value) + '</strong>' +
          '<em>' + escapeHtml(item.note) + '</em>' +
        '</div>';
      }).join('');

      const oversized = (communityAudit.oversized_communities || []).slice(0, 3).map(function(item) {
        return item.community_id + ' ' + item.article_count + ' 篇';
      }).join('；');
      const notes = (health.notes || []).join('；');
      communityAuditNote.innerHTML = escapeHtml(notes || '社区层 audit 已生成。') +
        (oversized ? '<br>需优先 review 的过大社区：' + escapeHtml(oversized) : '');
    }

    renderSources();
    renderPipelineNote();
    renderArtifacts();
    renderCommunityAudit();
    renderLogs();
  })();
  </script>
</div>
</body>
</html>
