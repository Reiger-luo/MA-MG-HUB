<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>诊治格局 · MA-MG-HUB</title>
<link rel="stylesheet" href="/MA-MG-HUB/assets/main.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/MA-MG-HUB/" class="nav-brand">MA-MG-HUB</a>
    <div class="nav-links">
      <a href="/MA-MG-HUB/" class="nav-link">工作台</a>
      <a href="/MA-MG-HUB/pages/literature.html" class="nav-link">情报中心</a>
      <a href="/MA-MG-HUB/pages/knowledge.html" class="nav-link">知识库</a>
      <a href="/MA-MG-HUB/pages/msl.html" class="nav-link">MSL工作台</a>
      <a href="/MA-MG-HUB/pages/materials.html" class="nav-link">内容工坊</a>
      <a href="/MA-MG-HUB/pages/landscape.html" class="nav-link active">诊治格局</a>
      <a href="/MA-MG-HUB/pages/data-ops.html" class="nav-link">数据状态</a>
    </div>
  </div>
</nav>

<main class="main">
  <div class="page-header">
    <h1>诊治格局</h1>
    <div class="page-header-actions">
      <span class="update-badge" id="landscapeBadge">Loading...</span>
    </div>
  </div>

  <div class="intel-tabs" role="tablist" aria-label="诊治格局视图">
    <button class="intel-tab active" type="button" data-landscape-tab="evidence">证据矩阵</button>
    <button class="intel-tab" type="button" data-landscape-tab="tracks">治疗进展</button>
    <button class="intel-tab" type="button" data-landscape-tab="china">中外差异</button>
    <button class="intel-tab" type="button" data-landscape-tab="competitive">竞争格局</button>
  </div>

  <section class="intel-tab-panel active" id="landscape-evidence">
    <div class="landscape-grid" id="evidenceMatrix"></div>
  </section>

  <section class="intel-tab-panel" id="landscape-tracks">
    <div class="chart-panel">
      <div class="chart-title">通路文献热度</div>
      <div class="chart-canvas" id="trackChart"></div>
    </div>
    <div class="landscape-grid" id="trackList"></div>
  </section>

  <section class="intel-tab-panel" id="landscape-china">
    <div class="workspace-panel">
      <h2>中外差异</h2>
      <div class="comparison-table" id="chinaDiff"></div>
    </div>
  </section>

  <section class="intel-tab-panel" id="landscape-competitive">
    <div class="workspace-panel">
      <h2>竞争管线</h2>
      <div class="pipeline-table" id="pipelineTable"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="/MA-MG-HUB/data/landscape-data.js"></script>
<script src="/MA-MG-HUB/assets/landscape.js"></script>
</body>
</html>
