<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSL 工作台 · MA-MG-HUB</title>
<link rel="stylesheet" href="/MA-MG-HUB/assets/main.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/MA-MG-HUB/" class="nav-brand">MA-MG-HUB</a>
    <div class="nav-links">
      <a href="/MA-MG-HUB/" class="nav-link">工作台</a>
      <a href="/MA-MG-HUB/pages/literature.html" class="nav-link">情报中心</a>
      <a href="/MA-MG-HUB/pages/landscape.html" class="nav-link">诊治格局</a>
      <a href="/MA-MG-HUB/pages/knowledge.html" class="nav-link">知识库</a>
      <a href="/MA-MG-HUB/pages/msl.html" class="nav-link active">MSL工作台</a>
      <a href="/MA-MG-HUB/pages/data-ops.html" class="nav-link">数据状态</a>
    </div>
  </div>
</nav>

<main class="main">
  <div class="page-header">
    <h1>MSL 工作台</h1>
    <div class="page-header-actions">
      <span class="update-badge" id="mslUpdate">Loading...</span>
    </div>
  </div>

  <div class="intel-tabs" role="tablist" aria-label="MSL 工作台视图">
    <button class="intel-tab active" type="button" data-msl-tab="experts">专家画像</button>
    <button class="intel-tab" type="button" data-msl-tab="visit">拜访助手</button>
  </div>

  <section class="intel-tab-panel" id="msl-visit">
    <div class="msl-assistant-layout">
      <div class="msl-setup-grid">
        <section class="workspace-panel msl-expert-picker">
          <div class="panel-head">
            <div>
              <h2>选择专家</h2>
              <p class="panel-caption" id="visitExpertMeta">Loading...</p>
            </div>
          </div>
          <div class="expert-search-box">
            <input class="filter-input" id="visitExpertSearch" placeholder="搜索全部作者：姓名 / 拼音 / 机构 / 国家 / 研究方向">
          </div>
          <div class="expert-search-results" id="visitChinaMatches"></div>
        </section>

        <section class="workspace-panel msl-module-picker">
          <div class="panel-head">
            <div>
              <h2>学术 / 产品信息</h2>
              <p class="panel-caption" id="moduleMeta">Loading...</p>
            </div>
          </div>
          <div class="module-list compact" id="visitModuleList"></div>
          <div class="compliance-box compact" id="visitCompliance"></div>
        </section>
      </div>

      <section class="workspace-panel msl-brief-panel">
        <div class="panel-head">
          <div>
            <h2>拜访话题建议</h2>
            <p class="panel-caption" id="selectedExpertLine">请选择专家</p>
          </div>
        </div>
        <div class="brief-preview msl-brief-output" id="visitBrief"></div>
      </section>
    </div>
  </section>

  <section class="intel-tab-panel active" id="msl-experts">
    <div class="workbench-grid msl-profile-grid">
      <aside class="sidebar-filters">
        <div class="filter-group">
          <label class="filter-label">搜索专家</label>
          <input class="filter-input" id="expertSearch" placeholder="姓名 / 拼音 / 机构 / 国家 / 方向">
        </div>
        <div class="filter-group">
          <label class="filter-label">专家范围</label>
          <div class="filter-radio-list" id="regionFilters">
            <label class="filter-checkbox-item"><input type="radio" name="region" value="china" checked> 中国</label>
            <label class="filter-checkbox-item"><input type="radio" name="region" value="international"> 国外</label>
            <label class="filter-checkbox-item"><input type="radio" name="region" value="all"> 全部</label>
          </div>
        </div>
        <div class="filter-group">
          <label class="filter-label">研究方向</label>
          <div class="filter-radio-list" id="topicFilters"></div>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="institutionFilter">机构</label>
          <input class="filter-input" id="institutionFilter" list="institutionOptions" placeholder="输入医院、大学或研究机构关键词">
          <datalist id="institutionOptions"></datalist>
        </div>
        <div class="filter-grid-two">
          <div class="filter-group">
            <label class="filter-label" for="provinceFilter" id="locationFilterLabel">省份</label>
            <select class="filter-input" id="provinceFilter">
              <option value="all">全部</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label" for="productivityFilter">发文量</label>
            <select class="filter-input" id="productivityFilter">
              <option value="all">全部</option>
              <option value="ge20">≥20 篇</option>
              <option value="ge10">10-19 篇</option>
              <option value="lt10">&lt;10 篇</option>
            </select>
          </div>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="activeFilter">近 3 年活跃</label>
          <select class="filter-input" id="activeFilter">
            <option value="all">全部</option>
            <option value="ge10">≥10 篇</option>
            <option value="ge5">5-9 篇</option>
            <option value="lt5">&lt;5 篇</option>
          </select>
        </div>
        <div class="filter-stats">候选专家 <strong id="expertCount">0</strong> 位</div>
      </aside>
      <section class="workspace-list">
        <div class="result-panel-head">
          <h2>匹配结果</h2>
          <span id="expertResultMeta">Loading...</span>
        </div>
        <div id="expertList"></div>
      </section>
      <aside class="workspace-detail" id="expertDetail"></aside>
    </div>
  </section>
</main>

<script src="/MA-MG-HUB/data/expert-profiles.js"></script>
<script src="/MA-MG-HUB/data/signals-weekly.js"></script>
<script src="/MA-MG-HUB/data/content-modules.js"></script>
<script src="/MA-MG-HUB/assets/msl.js"></script>
</body>
</html>
